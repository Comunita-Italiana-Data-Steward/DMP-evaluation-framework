name: Validate criteria JSON

on:
  pull_request:
    paths:
      - "framework/criteria/criteria.json"
      - "framework/criteria/criteria.schema.json"

jobs:
  validate:
    name: Validate criteria against schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JSON validation
        working-directory: framework
        run: python validate_json.py criteria/criteria.schema.json criteria/criteria.json
